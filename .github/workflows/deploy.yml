name: Deploy

# Push to main → build Docker images → Artifact Registry → Cloud Run (API),
# plus Vercel prod deploy for the Next.js web app (Fundio's path).
# Required GitHub secrets:
#   GCP_PROJECT_ID, GCP_REGION, GCP_SA_KEY (service account JSON),
#   ARTIFACT_REGISTRY_REPO (e.g. uze-images),
#   DATABASE_URL, DIRECT_URL, REDIS_URL, SECRET_KEY (Cloud Run runtime env),
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (web frontend)

on:
  push:
    branches: [main]

env:
  GCP_REGION: ${{ secrets.GCP_REGION }}

jobs:
  # Fails fast with a readable checklist when deploy secrets aren't set,
  # instead of two cryptic job failures. GCP and Vercel targets are gated
  # independently, so the web deploy is not blocked by the GCP project
  # decision. Add secrets at:
  # GitHub repo -> Settings -> Secrets and variables -> Actions.
  preflight-gcp:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GCP deploy secrets
        run: |
          missing=""
          [ -n "${{ secrets.GCP_SA_KEY }}" ] || missing="$missing GCP_SA_KEY"
          [ -n "${{ secrets.GCP_PROJECT_ID }}" ] || missing="$missing GCP_PROJECT_ID"
          [ -n "${{ secrets.GCP_REGION }}" ] || missing="$missing GCP_REGION"
          [ -n "${{ secrets.ARTIFACT_REGISTRY_REPO }}" ] || missing="$missing ARTIFACT_REGISTRY_REPO"
          if [ -n "$missing" ]; then
            echo "::error::Missing GCP secrets:$missing — add them under repo Settings -> Secrets and variables -> Actions (see docs/DEPLOY.md)."
            exit 1
          fi
          echo "GCP deploy secrets present."

  preflight-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel deploy secrets
        run: |
          missing=""
          [ -n "${{ secrets.VERCEL_TOKEN }}" ] || missing="$missing VERCEL_TOKEN"
          [ -n "${{ secrets.VERCEL_ORG_ID }}" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing Vercel secrets:$missing — add them under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Vercel deploy secrets present."

  api-cloudrun:
    needs: [preflight-gcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push API image
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/uze-api:${{ github.sha }}"
          docker build -f services/api/Dockerfile -t "$IMAGE" ./services/api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy uze-api \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --set-env-vars "DEBUG=false,APP_NAME=uze-api,BACKEND_CORS_ORIGINS=https://uze.fi" \
            --set-secrets "DATABASE_URL=uze-database-url:latest,DIRECT_URL=uze-direct-url:latest,REDIS_URL=uze-redis-url:latest,SECRET_KEY=uze-secret-key:latest" \
            --memory 1Gi --cpu 1 --min-instances 0 --max-instances 10

  web-vercel:
    needs: [preflight-vercel]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        working-directory: ./apps/uze-web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (prebuilt)
        working-directory: ./apps/uze-web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy (prebuilt)
        working-directory: ./apps/uze-web
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
