name: Deploy

# Push to main -> deploy the Next.js web app (apps/uze-web) to Vercel prod.
# Required GitHub secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# The API (Cloud Run) deploy returns as its own workflow when the GCP
# project decision lands — no gates here in the meantime.

on:
  push:
    branches: [main]

jobs:
  web-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        working-directory: ./apps/uze-web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (verify compile)
        working-directory: ./apps/uze-web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      # Vercel blocks deployments whose embedded git author isn't a team
      # member, so the deploy runs from a git-free copy of the app.
      - name: Stage deploy copy outside git tree
        run: |
          mkdir -p "$RUNNER_TEMP/uze-web-deploy"
          tar --exclude=node_modules --exclude=.next -cf - . | (cd "$RUNNER_TEMP/uze-web-deploy" && tar xf -)
        working-directory: ./apps/uze-web
      - name: Deploy (remote build, no-wait, no git metadata)
        working-directory: ${{ runner.temp }}/uze-web-deploy
        run: vercel deploy --prod --no-wait --token=${{ secrets.VERCEL_TOKEN }}
