name: Deploy

# Push to main → build Docker images → Artifact Registry → Cloud Run (API),
# plus Vercel prod deploy for the Next.js web app (Fundio's path).
# Required GitHub secrets:
#   GCP_PROJECT_ID, GCP_REGION, GCP_SA_KEY (service account JSON),
#   ARTIFACT_REGISTRY_REPO (e.g. uze-images),
#   DATABASE_URL, DIRECT_URL, REDIS_URL, SECRET_KEY (Cloud Run runtime env),
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (web frontend)

on:
  push:
    branches: [main]

env:
  GCP_REGION: ${{ secrets.GCP_REGION }}

jobs:
  api-cloudrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push API image
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/uze-api:${{ github.sha }}"
          docker build -f services/api/Dockerfile -t "$IMAGE" ./services/api
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy uze-api \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --set-env-vars "DEBUG=false,APP_NAME=uze-api,BACKEND_CORS_ORIGINS=https://uze.fi" \
            --set-secrets "DATABASE_URL=uze-database-url:latest,DIRECT_URL=uze-direct-url:latest,REDIS_URL=uze-redis-url:latest,SECRET_KEY=uze-secret-key:latest" \
            --memory 1Gi --cpu 1 --min-instances 0 --max-instances 10

  web-vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: "--prod"
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/uze-web
