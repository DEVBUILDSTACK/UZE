name: Deploy Dev Library

# Push to main (apps/dev-library changes) or manual dispatch ->
# deploy the Dev Library (apps/dev-library) to its own Vercel project
# "uze-dev-library" with dev.uzemarkets.com as its domain. Same secret
# pattern as deploy.yml: VERCEL_TOKEN + VERCEL_ORG_ID from repo secrets;
# the project id is resolved by name (this project is not
# VERCEL_PROJECT_ID, which belongs to uze-web). Every step echoes the
# raw API/CLI output so a failure names its own blocker.
#
# DATABASE NOTE (2026-11-18, run 2 blocker): Vercel Postgres was sunset
# in June 2025 — POST /v1/storage/stores for type=postgres returns
# {"error":{"code":"not_found"}}; new Postgres comes from the Vercel
# Marketplace (Neon), which injects DATABASE_URL into the project env.
# The store step below is therefore best-effort (connects a legacy store
# if one exists, never fails the deploy), and the seed step runs only
# when POSTGRES_URL or DATABASE_URL is actually present in the project
# env. Until a database is attached, the app runs on its JSON working
# set (LIBRARY_DATA=/tmp) exactly as rehearsed locally.
#
# NEON PROVISION STEP (added 2026-11-18, James's direction — "attach
# Neon; you should be able to do that through GitHub"): Vercel's
# documented non-interactive path is the CLI: `vercel integration add
# neon` provisions + connects a Marketplace resource with the CI token,
# and neon is the one integration whose `accept-terms` accepts --yes
# (vercel.com/docs/cli/integration). The step is best-effort and
# idempotent: it skips when a database URL is already in the env, and
# its full output stays in the run log so any blocker names itself.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/dev-library/**"
      - ".github/workflows/deploy-dev-library.yml"

concurrency:
  group: deploy-dev-library
  cancel-in-progress: false

jobs:
  dev-library-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      PROJECT_NAME: uze-dev-library
      STORE_NAME: dev-library-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Ensure Vercel project exists
        id: proj
        run: |
          set -u
          LIST=$(curl -s "https://api.vercel.com/v10/projects?teamId=${VERCEL_ORG_ID}&limit=100" -H "Authorization: Bearer ${VERCEL_TOKEN}")
          PID=$(echo "$LIST" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((p['id'] for p in d.get('projects',[]) if p['name']=='${PROJECT_NAME}'),''))")
          if [ -z "$PID" ]; then
            echo "project not found — creating ${PROJECT_NAME}"
            CREATE=$(curl -s -X POST "https://api.vercel.com/v10/projects?teamId=${VERCEL_ORG_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Content-Type: application/json" -d "{\"name\":\"${PROJECT_NAME}\"}")
            echo "$CREATE" | head -c 600; echo
            PID=$(echo "$CREATE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          fi
          echo "project_id=$PID" >> "$GITHUB_OUTPUT"
          echo "project id: $PID"
          test -n "$PID"

      - name: Stage deploy copy outside git tree
        run: |
          mkdir -p "$RUNNER_TEMP/dev-library-deploy"
          tar --exclude=node_modules --exclude=.vercel -cf - . | (cd "$RUNNER_TEMP/dev-library-deploy" && tar xf -)
        working-directory: ./apps/dev-library

      - name: Link project + pull settings
        working-directory: ${{ runner.temp }}/dev-library-deploy
        env:
          # The job env carries VERCEL_ORG_ID alone, which makes the CLI
          # demand its pair. Pair it with THIS project's id (run 1 blocker,
          # 2026-11-18: "You specified VERCEL_ORG_ID but you forgot to
          # specify VERCEL_PROJECT_ID").
          VERCEL_PROJECT_ID: ${{ steps.proj.outputs.project_id }}
        run: |
          vercel link --yes --project "$PROJECT_NAME" --token="$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Provision Neon via Marketplace (idempotent, best-effort)
        continue-on-error: true
        working-directory: ${{ runner.temp }}/dev-library-deploy
        env:
          VERCEL_PROJECT_ID: ${{ steps.proj.outputs.project_id }}
        run: |
          set -u
          # Idempotency: a database URL already in the production env means
          # a database is attached — never provision a second one.
          vercel env pull .env.dbcheck --environment=production --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          if grep -qE "^(POSTGRES_URL|DATABASE_URL)=" .env.dbcheck 2>/dev/null; then
            echo "database already attached (POSTGRES_URL/DATABASE_URL present in production env) — skipping provision"
            exit 0
          fi
          TEAM_SLUG=$(curl -s "https://api.vercel.com/v2/teams/${VERCEL_ORG_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('slug',''))" 2>/dev/null || echo "")
          SCOPE="${TEAM_SLUG:-$VERCEL_ORG_ID}"
          echo "team scope: $SCOPE"
          echo "== neon products / plans / metadata (ground truth for the add below)"
          vercel integration add neon --help --token="$VERCEL_TOKEN" --scope "$SCOPE" 2>&1 | head -c 3000; echo
          echo "== accept marketplace terms (neon is the one integration whose accept-terms supports --yes)"
          vercel integration accept-terms neon --yes --token="$VERCEL_TOKEN" --scope "$SCOPE" 2>&1 | head -c 1000; echo
          echo "== provision the neon resource and connect it to this project"
          vercel integration add neon --name "${STORE_NAME}" --meta region=iad1 --token="$VERCEL_TOKEN" --scope "$SCOPE" 2>&1 | tail -c 3000; echo
          echo "== production env names after provisioning (names only, no values)"
          vercel env ls production --token="$VERCEL_TOKEN" 2>/dev/null | grep -E "POSTGRES|DATABASE|NEON" || echo "no POSTGRES/DATABASE/NEON env names visible yet"

      - name: Attach Postgres store if one exists (legacy path, best-effort)
        continue-on-error: true
        run: |
          set -u
          STORES=$(curl -s "https://api.vercel.com/v1/storage/stores?teamId=${VERCEL_ORG_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")
          SID=$(echo "$STORES" | python3 -c "import json,sys; d=json.load(sys.stdin); s=d.get('stores',d if isinstance(d,list) else []); print(next((x['id'] for x in s if x.get('name')=='${STORE_NAME}'),''))" 2>/dev/null || echo "")
          if [ -z "$SID" ]; then
            echo "NOTICE: no legacy store named ${STORE_NAME}. Direct creation is retired"
            echo "(Vercel Postgres sunset June 2025; run 2 got not_found from the create API)."
            echo "The database now arrives via the Vercel Marketplace (Neon) as DATABASE_URL."
            echo "Deploy continues on the JSON working set; the seed step self-skips until then."
            exit 0
          fi
          echo "store id: $SID"
          echo "== connect store to project (idempotent; an 'already connected' response is fine)"
          curl -s -X POST "https://api.vercel.com/v1/storage/stores/${SID}/connections?teamId=${VERCEL_ORG_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Content-Type: application/json" -d "{\"projectId\":\"${{ steps.proj.outputs.project_id }}\",\"type\":\"postgres\",\"environments\":[\"production\",\"preview\",\"development\"]}" | head -c 800; echo

      - name: Ensure project env (working-set dir + session secret)
        working-directory: ${{ runner.temp }}/dev-library-deploy
        env:
          VERCEL_PROJECT_ID: ${{ steps.proj.outputs.project_id }}
        run: |
          set -u
          EXISTING=$(vercel env ls production --token="$VERCEL_TOKEN" 2>/dev/null || echo "")
          if ! echo "$EXISTING" | grep -q "LIBRARY_DATA"; then
            printf "/tmp/dev-library-data" | vercel env add LIBRARY_DATA production --token="$VERCEL_TOKEN"
          fi
          if ! echo "$EXISTING" | grep -q "LIBRARY_SECRET"; then
            openssl rand -hex 32 | tr -d '\n' | vercel env add LIBRARY_SECRET production --token="$VERCEL_TOKEN"
          fi
          echo "env present: $(vercel env ls production --token="$VERCEL_TOKEN" 2>/dev/null | grep -E 'LIBRARY|POSTGRES' || true)"

      # RESEND_API_KEY sync (added 2026-11-18, James's direction —
      # Vercel is operated through this GitHub/API route, never the
      # dashboard): the key is placed as an Actions repository secret by
      # a separate session; this step upserts it into the project's
      # production env with the same CLI pattern as the step above. It
      # is best-effort and inert until the secret exists, and the value
      # is never echoed — it is masked up front, piped to `env add` on
      # stdin, and that command's output is discarded.
      - name: Sync RESEND_API_KEY from Actions secret (best-effort)
        continue-on-error: true
        working-directory: ${{ runner.temp }}/dev-library-deploy
        env:
          VERCEL_PROJECT_ID: ${{ steps.proj.outputs.project_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -u
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "RESEND_API_KEY Actions secret not set — skipping (mailer stays inert until it is placed)"
            exit 0
          fi
          echo "::add-mask::$RESEND_API_KEY"
          EXISTING=$(vercel env ls production --token="$VERCEL_TOKEN" 2>/dev/null || echo "")
          if echo "$EXISTING" | grep -q "RESEND_API_KEY"; then
            echo "RESEND_API_KEY already in production env — replacing (upsert)"
            vercel env rm RESEND_API_KEY production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          fi
          printf %s "$RESEND_API_KEY" | vercel env add RESEND_API_KEY production --token="$VERCEL_TOKEN" >/dev/null
          echo "RESEND_API_KEY synced to production env (value not shown)"

      # RESEND_WEBHOOK_SECRET sync (added 2026-11-18, same pattern and
      # rationale as the RESEND_API_KEY step above): the webhook signing
      # secret is placed as an Actions repository secret by a separate
      # session; this step upserts it into the project's production env.
      # Best-effort and inert until the secret exists; the value is never
      # echoed. Until it lands, POST /api/resend-webhook answers 503.
      - name: Sync RESEND_WEBHOOK_SECRET from Actions secret (best-effort)
        continue-on-error: true
        working-directory: ${{ runner.temp }}/dev-library-deploy
        env:
          VERCEL_PROJECT_ID: ${{ steps.proj.outputs.project_id }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
        run: |
          set -u
          if [ -z "${RESEND_WEBHOOK_SECRET:-}" ]; then
            echo "RESEND_WEBHOOK_SECRET Actions secret not set — skipping (webhook endpoint stays 503 until it is placed)"
            exit 0
          fi
          echo "::add-mask::$RESEND_WEBHOOK_SECRET"
          EXISTING=$(vercel env ls production --token="$VERCEL_TOKEN" 2>/dev/null || echo "")
          if echo "$EXISTING" | grep -q "RESEND_WEBHOOK_SECRET"; then
            echo "RESEND_WEBHOOK_SECRET already in production env — replacing (upsert)"
            vercel env rm RESEND_WEBHOOK_SECRET production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          fi
          printf %s "$RESEND_WEBHOOK_SECRET" | vercel env add RESEND_WEBHOOK_SECRET production --token="$VERCEL_TOKEN" >/dev/null
          echo "RESEND_WEBHOOK_SECRET synced to production env (value not shown)"

      # LIBRARY_MASTER_TOKEN sync (added 2026-11-18, same pattern and
      # rationale as the RESEND steps above): the Dev Library master
      # token is placed as an Actions repository secret; this step
      # upserts it into the project's production env, opening the
      # /api/admin/* master-control surface. Best-effort and inert
      # until the secret exists; the value is never echoed. Until it
      # lands, /api/admin/* answers 403 to every caller.
      - name: Sync LIBRARY_MASTER_TOKEN from Actions secret (best-effort)
        continue-on-error: true
        working-directory: ${{ runner.temp }}/dev-library-deploy
        env:
          VERCEL_PROJECT_ID: ${{ steps.proj.outputs.project_id }}
          LIBRARY_MASTER_TOKEN: ${{ secrets.LIBRARY_MASTER_TOKEN }}
        run: |
          set -u
          if [ -z "${LIBRARY_MASTER_TOKEN:-}" ]; then
            echo "LIBRARY_MASTER_TOKEN Actions secret not set — skipping (admin API stays closed until it is placed)"
            exit 0
          fi
          echo "::add-mask::$LIBRARY_MASTER_TOKEN"
          EXISTING=$(vercel env ls production --token="$VERCEL_TOKEN" 2>/dev/null || echo "")
          if echo "$EXISTING" | grep -q "LIBRARY_MASTER_TOKEN"; then
            echo "LIBRARY_MASTER_TOKEN already in production env — replacing (upsert)"
            vercel env rm LIBRARY_MASTER_TOKEN production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          fi
          printf %s "$LIBRARY_MASTER_TOKEN" | vercel env add LIBRARY_MASTER_TOKEN production --token="$VERCEL_TOKEN" >/dev/null
          echo "LIBRARY_MASTER_TOKEN synced to production env (value not shown)"

      - name: Build (verify compile)
        working-directory: ${{ runner.temp }}/dev-library-deploy
        env:
          VERCEL_PROJECT_ID: ${{ steps.proj.outputs.project_id }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy (prebuilt, production)
        id: deploy
        working-directory: ${{ runner.temp }}/dev-library-deploy
        env:
          VERCEL_PROJECT_ID: ${{ steps.proj.outputs.project_id }}
        run: |
          URL=$(vercel deploy --prod --prebuilt --token="$VERCEL_TOKEN" | tail -1)
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
          echo "deployed: $URL"

      - name: Add domain dev.uzemarkets.com
        run: |
          set -u
          PID="${{ steps.proj.outputs.project_id }}"
          echo "== POST domain (idempotent)"
          curl -s -X POST "https://api.vercel.com/v10/projects/${PID}/domains?teamId=${VERCEL_ORG_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Content-Type: application/json" -d '{"name":"dev.uzemarkets.com"}' | head -c 600; echo
          echo "== domain state (verification / DNS requirements, if any)"
          curl -s "https://api.vercel.com/v9/projects/${PID}/domains/dev.uzemarkets.com?teamId=${VERCEL_ORG_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" | head -c 1200; echo
          curl -s "https://api.vercel.com/v6/domains/dev.uzemarkets.com/config?teamId=${VERCEL_ORG_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" | head -c 800; echo

      - name: Seed the data layer
        working-directory: ./apps/dev-library
        env:
          VERCEL_PROJECT_ID: ${{ steps.proj.outputs.project_id }}
        run: |
          cd "$RUNNER_TEMP/dev-library-deploy" && vercel env pull .env.production.local --environment=production --token="$VERCEL_TOKEN" && cd -
          PGURL=$(grep -E "^(POSTGRES_URL|DATABASE_URL)=" "$RUNNER_TEMP/dev-library-deploy/.env.production.local" | head -1 | cut -d= -f2- | tr -d '"')
          if [ -z "$PGURL" ]; then
            echo "NOTICE: no POSTGRES_URL / DATABASE_URL in project env — no database attached yet."
            echo "Skipping the seed. Attach a Marketplace Postgres (Neon) to uze-dev-library and"
            echo "re-run this workflow; the seed is idempotent and will populate the data layer then."
            exit 0
          fi
          npm install --no-workspaces --no-audit --no-fund pg
          DATABASE_URL="$PGURL" node db/seed.mjs

      - name: Smoke check
        run: |
          set -u
          echo "== deployment URL"
          curl -s -o /dev/null -w "%{http_code}\n" "${{ steps.deploy.outputs.deployment_url }}/"
          curl -s "${{ steps.deploy.outputs.deployment_url }}/api/catalog" | head -c 200; echo
          echo "== dev.uzemarkets.com (may lag until DNS verifies)"
          curl -s -o /dev/null -w "%{http_code}\n" "https://dev.uzemarkets.com/" || true
