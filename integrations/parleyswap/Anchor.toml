# SCAFFOLD — placeholder Anchor configuration.
#
# Mirrors `intents/Anchor.toml` in Nithin-Varma/parleySwap.
# Program ids, cluster, and wallet settings are filled in when
# Nithin's sealed_bid_auction program plugs in (Sprint 2).
# Nothing is deployed from this file.

[features]
resolution = true
skip-lint = false

[programs.devnet]
# sealed_bid_auction = "<program id lands in Sprint 2>"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
