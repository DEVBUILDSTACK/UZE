[project]
name = "uze-api"
version = "0.1.0"
description = "UZE monolithic backend — FastAPI + Prisma + Redis"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]~=0.115.12",
    "uvicorn[standard]~=0.30.2",
    "prisma~=0.15.0",
    "psycopg2-binary~=2.9.10",
    "pydantic-settings~=2.8.1",
    "redis~=5.2.1",
    "httpx~=0.28.1",
    "PyJWT>=2.14.0",
    "passlib[bcrypt]~=1.7.4",
    "resend~=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.4",
    "pytest-asyncio~=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
# This service runs from src/ (loose modules, uvicorn src.api:create_app);
# it is not installed as a library. package = false stops uv from trying to
# build the project package during `uv sync --frozen --no-dev`.
# Watch item (DeepSeek, 2026-11-01): if services/api ever needs to be
# importable by other services/tests as a library, revisit this setting.
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
